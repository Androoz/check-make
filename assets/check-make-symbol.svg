<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">Check Make symbol</title>
  <desc id="description">An isometric object transitioning from a navy blueprint into a manufactured white frame, verified by a green check mark.</desc>
  <defs>
    <clipPath id="blueprint-half"><rect width="128" height="256"/></clipPath>
    <clipPath id="manufactured-half"><rect x="128" width="128" height="256"/></clipPath>
    <linearGradient id="frame-face" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".48" stop-color="#f6f7f5"/>
      <stop offset="1" stop-color="#d9dcda"/>
    </linearGradient>
    <linearGradient id="check-face" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#52dba0"/>
      <stop offset=".55" stop-color="#35c98b"/>
      <stop offset="1" stop-color="#26b97c"/>
    </linearGradient>
    <filter id="frame-shadow" x="-25%" y="-25%" width="160%" height="175%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#5f6663" flood-opacity=".28"/>
    </filter>
    <filter id="check-shadow" x="-25%" y="-30%" width="165%" height="185%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0b513b" flood-opacity=".34"/>
    </filter>
  </defs>

  <!-- Manufactured half: a softly bevelled white frame with enough grey edge
       definition to remain visible on the warm-white application surface. -->
  <g clip-path="url(#manufactured-half)" fill="none" stroke-linecap="square" stroke-linejoin="miter" filter="url(#frame-shadow)">
    <path d="M128 20 216 69v105l-88 50-88-50V69Zm-88 49 88 51 88-51M128 120v104" stroke="#aeb3b0" stroke-width="19" opacity=".42" transform="translate(2 3)"/>
    <path d="M128 20 216 69v105l-88 50-88-50V69Zm-88 49 88 51 88-51M128 120v104" stroke="url(#frame-face)" stroke-width="15"/>
    <path d="M128 20 216 69M216 69v105M216 174l-88 50" stroke="#ffffff" stroke-width="4" opacity=".78" transform="translate(-1 -2)"/>
  </g>

  <!-- Blueprint half: the same geometry expressed only as precise construction
       lines, including an inset outline like the approved reference artwork. -->
  <g clip-path="url(#blueprint-half)" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <g stroke="#0b3763" stroke-width="3">
      <path d="M128 20 216 69v105l-88 50-88-50V69Z"/>
      <path d="m40 69 88 51 88-51M128 120v104"/>
    </g>
    <g stroke="#174875" stroke-width="2.4">
      <path d="M128 38 69 71l59 34"/>
      <path d="M55 82v82l73 42M113 128v69"/>
    </g>
  </g>

  <!-- The check is deliberately a foreground object, with the small bevel and
       shadow visible in the supplied symbol and wordmark reference. -->
  <path d="m64 132 52 42 89-96" fill="none" stroke="#166b50" stroke-width="27" stroke-linecap="round" stroke-linejoin="round" opacity=".28" transform="translate(1 3)"/>
  <path d="m64 132 52 42 89-96" fill="none" stroke="url(#check-face)" stroke-width="23" stroke-linecap="round" stroke-linejoin="round" filter="url(#check-shadow)"/>
  <path d="m64 132 52 42 89-96" fill="none" stroke="#a0f0cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".58" transform="translate(-1 -4)"/>
</svg>

# Evidence review for every rule in mvp-rules.yaml.
# Levels: A = replicated internal validation; B = relevant primary experiment;
# C = authoritative/manufacturer best practice; D = expert assumption only.
# All MVP rules remain provisional until their exact decision boundary and action
# have been validated in Check Make's controlled process window.

# Geometry
- {ruleId: G01, status: provisional, evidenceLevel: B, sourceIds: [SHEN-2020, RODRIGUEZ-PANES-2020], supportedClaim: "Orientation should balance support, surface, time, and mechanical objectives.", unsupportedSpecifics: "Six axis-aligned candidates and Check Make's fixed scoring weights.", experimentPriority: high}
- {ruleId: G02, status: provisional, evidenceLevel: D, sourceIds: [], supportedClaim: "None recorded.", unsupportedSpecifics: "150 mm height threshold and mapping every taller part to Silent.", experimentPriority: high}
- {ruleId: G03, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-BRIM, PRUSA-SUPPORTS, FFF-BED-ADHESION-DEVICE-2022, SPOERK-PLA-BED-TEMP-2018], supportedClaim: "A brim can help a tall object with a small base; measured first-layer adhesion also depends strongly on surface and bed temperature.", unsupportedSpecifics: "Absolute 400 mm2 threshold, omission of height/center of mass/material/process, and fixed 8 mm width; published adhesion aggregates do not match textured PEI on X1C.", experimentPriority: high}
- {ruleId: G04, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-BRIM, FFF-BED-ADHESION-DEVICE-2022, SPOERK-PLA-BED-TEMP-2018], supportedClaim: "Brim need is related to first-layer area and object stability, while achievable adhesion depends on the surface and thermal process.", unsupportedSpecifics: "Turning brim off at 400 mm2 regardless of other risk factors; no open raw textured-PEI force data support this cutoff.", experimentPriority: high}
- {ruleId: G05, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-SUPPORTS, OVERHANG-PLA-2025, ANDERSONS-WAVE-OVERHANG-2026], supportedClaim: "Overhang geometry and path planning contribute to support need and sagging.", unsupportedSpecifics: "Support Auto when critical overhang area exceeds 8 percent of total surface.", experimentPriority: high}
- {ruleId: G06, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-SUPPORTS, OVERHANG-PLA-2025, ANDERSONS-WAVE-OVERHANG-2026], supportedClaim: "Some overhang geometry can be printable without support when the process and path strategy permit it.", unsupportedSpecifics: "Support Off at or below an 8 percent area ratio for every material and process.", experimentPriority: high}
- {ruleId: G07, status: provisional, evidenceLevel: B, sourceIds: [SHEN-2020, OVERHANG-PLA-2025, ANDERSONS-WAVE-OVERHANG-2026], supportedClaim: "Orientation and path planning can reduce support demand and improve surface quality.", unsupportedSpecifics: "20 percent area-ratio trigger and use of a score without critical-surface knowledge.", experimentPriority: high}
- {ruleId: G08, status: provisional, evidenceLevel: B, sourceIds: [PRUSA-LAYERS-PERIMETERS, MENDELEY-PLA-PROCESS-QUALITY-2026], supportedClaim: "Layer height changes surface response, Z resolution, and layer count in scoped PLA experiments.", unsupportedSpecifics: "Model height below 20 mm as a reason to select exactly 0.16 mm on an X1C.", experimentPriority: medium}
- {ruleId: G09, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-BRIM, FFF-BED-ADHESION-DEVICE-2022, SPOERK-PLA-BED-TEMP-2018], supportedClaim: "Tall objects with a small base can benefit from a brim, and the available resisting adhesion force is process- and surface-dependent.", unsupportedSpecifics: "Height above 220 mm alone and fixed 10 mm brim width; summary adhesion studies do not establish a geometry-to-force boundary for X1C textured PEI.", experimentPriority: high}
- {ruleId: G10, status: provisional, evidenceLevel: D, sourceIds: [SHEN-2020], supportedClaim: "Orientation must account for build-volume feasibility.", unsupportedSpecifics: "Universal X-only 240 mm trigger rather than the selected printer and all oriented dimensions.", experimentPriority: high}

# Usage
- {ruleId: U01, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-LAYERS-PERIMETERS, PRUSA-INFILL], supportedClaim: "Functional strength often benefits from additional perimeter material.", unsupportedSpecifics: "Keyword classification and a universal minimum of four wall loops.", experimentPriority: high}
- {ruleId: U02, status: provisional, evidenceLevel: B, sourceIds: [PRUSA-LAYERS-PERIMETERS, RODRIGUEZ-PANES-2020], supportedClaim: "Shell and process parameters affect mechanical response.", unsupportedSpecifics: "Medium impact category mapping to exactly four wall loops.", experimentPriority: high}
- {ruleId: U03, status: provisional, evidenceLevel: B, sourceIds: [PRUSA-LAYERS-PERIMETERS, RODRIGUEZ-PANES-2020], supportedClaim: "Additional perimeter material can increase structural capacity.", unsupportedSpecifics: "High impact category mapping to exactly five wall loops without a test geometry or load case.", experimentPriority: high}
- {ruleId: U04, status: provisional, evidenceLevel: B, sourceIds: [PRUSA-INFILL, DAVE-2021], supportedClaim: "Infill density affects mechanical behavior.", unsupportedSpecifics: "High impact category mapping to a 25 percent minimum.", experimentPriority: high}
- {ruleId: U05, status: provisional, evidenceLevel: B, sourceIds: [PRUSA-INFILL, DAVE-2021], supportedClaim: "Infill density affects mechanical behavior.", unsupportedSpecifics: "Medium impact category mapping to a 20 percent minimum.", experimentPriority: high}
- {ruleId: U06, status: provisional, evidenceLevel: B, sourceIds: [PRUSA-LAYERS-PERIMETERS, RODRIGUEZ-PANES-2020, KONTAXIS-X1C-PLA-2025], supportedClaim: "Printed-part properties depend on shell, orientation, and process temperature; X1 Carbon PLA flexural observations confirm orientation dependence in a scoped coupon.", unsupportedSpecifics: "Four walls as a fatigue margin without fatigue data, stress amplitude, geometry, or material grade.", experimentPriority: high}
- {ruleId: U07, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-LAYERS-PERIMETERS], supportedClaim: "External-perimeter-first can improve dimensional accuracy with surface tradeoffs.", unsupportedSpecifics: "Keyword inference and universal Outer/Inner selection without feature-level geometry.", experimentPriority: medium}
- {ruleId: U08, status: provisional, evidenceLevel: C, sourceIds: [ORCA-SEAM], supportedClaim: "Seams affect fit, appearance, and local strength.", unsupportedSpecifics: "The engine does not know which surface is a mating surface or what Back means for the part.", experimentPriority: high}
- {ruleId: U09, status: provisional, evidenceLevel: D, sourceIds: [], supportedClaim: "None recorded.", unsupportedSpecifics: "Six top layers as weather sealing without leakage, layer-height, extrusion-width, or aging data.", experimentPriority: high}
- {ruleId: U10, status: provisional, evidenceLevel: D, sourceIds: [], supportedClaim: "None recorded.", unsupportedSpecifics: "Five bottom layers as outdoor robustness without a defined failure mode.", experimentPriority: high}

# Material
- {ruleId: M01, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-MATERIAL-GUIDE, PRUSA-PLA], supportedClaim: "PLA is an accessible low-warp baseline for non-demanding prototypes.", unsupportedSpecifics: "One universal 220/55 C profile and PLA as default without filament/printer context.", experimentPriority: medium}
- {ruleId: M02, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-PETG, PRUSA-MATERIAL-GUIDE], supportedClaim: "PETG is suitable for many mechanical and exterior applications below its service limit.", unsupportedSpecifics: "Every outdoor case mapping to PETG and one universal 250/75 C profile.", experimentPriority: high}
- {ruleId: M03, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-PETG, PRUSA-ASA], supportedClaim: "Weather and UV exposure should influence material selection.", unsupportedSpecifics: "PETG as the universal weather-resistant choice despite ASA's stronger UV guidance.", experimentPriority: high}
- {ruleId: M04, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-PETG], supportedClaim: "PETG is generally tougher and less brittle than typical PLA.", unsupportedSpecifics: "Medium impact label as sufficient evidence to select PETG and exact temperatures.", experimentPriority: high}
- {ruleId: M05, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-PETG], supportedClaim: "Material toughness matters for impact exposure.", unsupportedSpecifics: "PETG as a universal high-impact material without grade-specific impact data.", experimentPriority: high}
- {ruleId: M06, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-PLA, PRUSA-PETG], supportedClaim: "PETG generally retains utility at higher temperatures than PLA.", unsupportedSpecifics: "Undefined warm category and selection without service temperature, duration, load, or creep data.", experimentPriority: high}
- {ruleId: M07, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-ASA, PRUSA-MATERIAL-GUIDE], supportedClaim: "ASA offers higher heat and UV resistance than PLA and benefits from an enclosure.", unsupportedSpecifics: "Undefined hot category and one universal 260/100 C profile.", experimentPriority: high}
- {ruleId: M08, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-FLEX], supportedClaim: "TPU/TPE families are appropriate when flexibility is the primary requirement.", unsupportedSpecifics: "No hardness, strain, load, feed-path, or brand distinction and one temperature pair.", experimentPriority: medium}
- {ruleId: M09, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-FLEX], supportedClaim: "Flexible or damping functions can indicate a TPU/TPE candidate.", unsupportedSpecifics: "Keyword-only selection without target hardness, deformation, or recovery requirements.", experimentPriority: medium}
- {ruleId: M10, status: provisional-contested, evidenceLevel: D, sourceIds: [PRUSA-COMPOSITES, PRUSA-NYLON], supportedClaim: "Some PA-CF grades improve stiffness, dimensional stability, heat resistance, and tensile yield strength.", unsupportedSpecifics: "High impact mapping is potentially contrary to reported reductions in Charpy impact resistance and layer adhesion; exact 285/100 C values are grade-specific.", experimentPriority: critical}

# Process
- {ruleId: P01, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-LAYERS-PERIMETERS], supportedClaim: "0.20 mm is a common general-purpose layer height for a 0.4 mm nozzle.", unsupportedSpecifics: "No explicit nozzle diameter exists in the rule context and the value is not optimal for every objective.", experimentPriority: medium}
- {ruleId: P02, status: provisional, evidenceLevel: D, sourceIds: [DAVE-2021, PRUSA-INFILL], supportedClaim: "Infill pattern and direction can affect mechanical behavior.", unsupportedSpecifics: "Gyroid as the universal choice for unknown load direction; evidence is process- and load-case-dependent.", experimentPriority: high}
- {ruleId: P03, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-LAYERS-PERIMETERS, ORCA-SEAM], supportedClaim: "Arachne handles varying wall widths and seam placement affects finish.", unsupportedSpecifics: "Bundling Arachne with Nearest/back as a universal baseline, including functional concave-corner cases.", experimentPriority: medium}
- {ruleId: P04, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-INFILL, PRUSA-LAYERS-PERIMETERS], supportedClaim: "About 15 percent infill is a common general baseline and multiple perimeters/top layers are normal.", unsupportedSpecifics: "Exact combination of five top layers, three walls, and 15 percent infill independent of layer/extrusion width.", experimentPriority: medium}
- {ruleId: P05, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-LAYERS-PERIMETERS], supportedClaim: "Bottom shell thickness should be controlled.", unsupportedSpecifics: "Four layers rather than a physical thickness and independence from layer height.", experimentPriority: medium}
- {ruleId: P06, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-LAYERS-PERIMETERS, ORCA-SEAM], supportedClaim: "Wall order trades dimensional accuracy against surface and seam behavior.", unsupportedSpecifics: "Inner/Outer as a universal robust default for all functional geometry.", experimentPriority: medium}
- {ruleId: P07, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-BRIM, FFF-BED-ADHESION-DEVICE-2022, SPOERK-PLA-BED-TEMP-2018], supportedClaim: "Brim should be added for a demonstrated adhesion or stability need; adhesion force varies with material, build surface, and bed temperature.", unsupportedSpecifics: "Off as a universal default without material, plate, first-layer, or geometry context; no raw scope-matched data quantify when textured-PEI adhesion is insufficient.", experimentPriority: medium}
- {ruleId: P08, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-SUPPORTS], supportedClaim: "Support should be geometry- and process-driven.", unsupportedSpecifics: "Off as a universal default before bridge, material, cooling, and local-feature analysis.", experimentPriority: medium}
- {ruleId: P09, status: provisional, evidenceLevel: D, sourceIds: [], supportedClaim: "None recorded.", unsupportedSpecifics: "Standard is not a portable or quantitatively defined speed/acceleration state.", experimentPriority: medium}
- {ruleId: P10, status: provisional, evidenceLevel: D, sourceIds: [], supportedClaim: "None recorded.", unsupportedSpecifics: "Duplicate 150 mm height threshold and printer-independent Silent mapping.", experimentPriority: high}

# Quality
- {ruleId: Q01, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-LAYERS-PERIMETERS, PRUSA-INFILL], supportedClaim: "Additional perimeters are often more effective for strength than additional sparse infill.", unsupportedSpecifics: "Strength priority mapping to exactly four wall loops.", experimentPriority: high}
- {ruleId: Q02, status: provisional, evidenceLevel: B, sourceIds: [PRUSA-INFILL, DAVE-2021, RODRIGUEZ-PANES-2020], supportedClaim: "Infill density affects stiffness and tensile behavior in tested parts.", unsupportedSpecifics: "Strength priority mapping to a universal 20 percent minimum.", experimentPriority: high}
- {ruleId: Q03, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-LAYERS-PERIMETERS, ISO-ASTM-52902, MENDELEY-PLA-PROCESS-QUALITY-2026], supportedClaim: "Layer height and other process variables affect measured dimensional error in scoped PLA cube experiments.", unsupportedSpecifics: "Accuracy priority mapping to 0.16 mm and quantitative transfer from Pratham 5.0 to X1C.", experimentPriority: high}
- {ruleId: Q04, status: provisional, evidenceLevel: D, sourceIds: [MENDELEY-PLA-PROCESS-QUALITY-2026], supportedClaim: "Print speed is one measured factor in scoped PLA dimensional-error experiments.", unsupportedSpecifics: "Silent preset as a universal means of reducing dimensional error or transfer to X1C acceleration behavior.", experimentPriority: high}
- {ruleId: Q05, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-LAYERS-PERIMETERS, MENDELEY-PLA-PROCESS-QUALITY-2026], supportedClaim: "Layer height and raster orientation affect measured surface roughness in scoped PLA experiments.", unsupportedSpecifics: "Finish priority mapping to exactly 0.16 mm regardless of surface orientation, printer, nozzle, or slicer.", experimentPriority: medium}
- {ruleId: Q06, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-SEAM, ORCA-SEAM], supportedClaim: "Controlled seam placement can move a visible artifact.", unsupportedSpecifics: "Back is not known to be hidden or non-critical for an arbitrary STL.", experimentPriority: high}
- {ruleId: Q07, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-LAYERS-PERIMETERS], supportedClaim: "Higher layer height reduces layer count within nozzle limits.", unsupportedSpecifics: "Speed priority mapping to exactly 0.24 mm without volumetric-flow or geometry constraints.", experimentPriority: medium}
- {ruleId: Q08, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-INFILL], supportedClaim: "Moderate infill can limit material use and print time.", unsupportedSpecifics: "15 percent as the universal speed-priority minimum even when less may be adequate.", experimentPriority: medium}
- {ruleId: Q09, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-SUPPORTS, SHEN-2020, ANDERSONS-WAVE-OVERHANG-2026], supportedClaim: "A no-support constraint should influence orientation, path strategy, and process planning.", unsupportedSpecifics: "The current orientation search cannot guarantee that critical overhangs are resolved or that a specialized wave path is available.", experimentPriority: critical}
- {ruleId: Q10, status: provisional, evidenceLevel: B, sourceIds: [SHEN-2020, ANDERSONS-WAVE-OVERHANG-2026], supportedClaim: "Orientation and toolpath strategy are central to support-free process planning.", unsupportedSpecifics: "Six candidates and the current score do not establish that a support-free orientation or standard slicer path exists.", experimentPriority: critical}

# Optimization objectives
- {ruleId: O01, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-LAYERS-PERIMETERS], supportedClaim: "Increasing layer height within nozzle limits reduces layer count and commonly reduces print time.", unsupportedSpecifics: "0.24 mm is not universally optimal and does not model volumetric flow, cooling, or small-feature limits.", experimentPriority: medium}
- {ruleId: O02, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-INFILL], supportedClaim: "Avoiding unnecessary sparse infill can reduce material use and print time.", unsupportedSpecifics: "15 percent is a provisional floor and not a validated optimum for arbitrary load cases.", experimentPriority: high}
- {ruleId: O03, status: provisional, evidenceLevel: C, sourceIds: [PRUSA-LAYERS-PERIMETERS, PRUSA-INFILL], supportedClaim: "Additional perimeters often improve functional-part strength more effectively than additional sparse infill.", unsupportedSpecifics: "Five wall loops is not a universal performance optimum and depends on extrusion width and section thickness.", experimentPriority: high}
- {ruleId: O04, status: provisional, evidenceLevel: B, sourceIds: [PRUSA-INFILL, DAVE-2021, RODRIGUEZ-PANES-2020], supportedClaim: "Infill density affects stiffness and tensile behavior in tested FFF parts.", unsupportedSpecifics: "25 percent is not a universal optimum and cannot substitute for load-path or anisotropy analysis.", experimentPriority: high}

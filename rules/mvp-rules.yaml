- {id: M08, group: material, priority: 85, conditions: [{path: answers.priority, op: eq, value: flexibility}], actions: [{setting: material, value: TPU, mode: set}, {setting: nozzle_temperature, value: "230 °C", mode: set}, {setting: bed_temperature, value: "50 °C", mode: set}], reason: "Flexible material baseline.", confidence: 0.9}
- {id: M09, group: material, priority: 86, conditions: [{path: intent.compatibility.flexible, op: eq, value: true}], actions: [{setting: material, value: TPU, mode: set}, {setting: nozzle_temperature, value: "230 °C", mode: set}, {setting: bed_temperature, value: "50 °C", mode: set}], reason: "Flexible function material baseline.", confidence: 0.82}
# Printer (P01-P10)
- {id: P01, group: process, priority: 3, conditions: [], actions: [{setting: layer_height, value: 0.20 mm, mode: set}], reason: "0,20 mm är en robust startpunkt för 0,4 mm-munstycke.", confidence: 0.9}
- {id: P02, group: process, priority: 4, conditions: [], actions: [{setting: infill_type, value: Gyroid, mode: set}], reason: "Gyroid är en generell fyllnad för okänd belastningsriktning.", confidence: 0.77}
- {id: P03, group: process, priority: 5, conditions: [], actions: [{setting: wall_generator, value: Arachne, mode: set}, {setting: seam, value: Nearest/back, mode: set}], reason: "Arachne hanterar varierande väggbredder väl och en samlad söm förenklar efterbearbetning.", confidence: 0.74}
- {id: P04, group: process, priority: 6, conditions: [], actions: [{setting: top_layers, value: 5, mode: min}, {setting: wall_loops, value: 3, mode: min}, {setting: infill_percent, value: 15, mode: min}], reason: "Basprofilen använder fem topplager, tre väggslingor och 15 procent fyllnad innan behov vägs in.", confidence: 0.82}
- {id: P05, group: process, priority: 7, conditions: [], actions: [{setting: bottom_layers, value: 4, mode: min}], reason: "Basprofilen använder fyra bottenskikt.", confidence: 0.82}
- {id: P06, group: process, priority: 8, conditions: [], actions: [{setting: wall_order, value: Inner/Outer, mode: set}], reason: "Inner/Outer är robust standard för funktionell geometri.", confidence: 0.78}
- {id: P07, group: process, priority: 9, conditions: [], actions: [{setting: brim, value: Off, mode: set}], reason: "Brim is geometry-driven.", confidence: 0.6}
- {id: P08, group: process, priority: 10, conditions: [], actions: [{setting: support, value: Off, mode: set}], reason: "Support is geometry-driven.", confidence: 0.6}
- {id: P09, group: process, priority: 11, conditions: [], actions: [{setting: speed_preset, value: Standard, mode: set}], reason: "Standard är neutral hastighetsbas innan behov och geometri vägs in.", confidence: 0.75}
- {id: P10, group: process, priority: 56, conditions: [{path: analysis.heightMm, op: gt, value: 150}], actions: [{setting: speed_preset, value: Silent, mode: set}], reason: "En hög modell gynnas av lugnare rörelser oberoende av skrivarmodell.", confidence: 0.7}
# Quality (Q01-Q10)
- {id: Q01, group: quality, priority: 60, conditions: [{path: answers.priority, op: eq, value: strength}], actions: [{setting: wall_loops, value: 4, mode: min}], reason: "Styrkeprioritet lägger material i perimetrarna.", confidence: 0.85}
- {id: Q02, group: quality, priority: 61, conditions: [{path: answers.priority, op: eq, value: strength}], actions: [{setting: infill_percent, value: 20, mode: min}], reason: "Styrkeprioritet använder minst 20 procent fyllnad.", confidence: 0.78}
- {id: Q03, group: quality, priority: 62, conditions: [{path: answers.priority, op: eq, value: accuracy}], actions: [{setting: layer_height, value: 0.16 mm, mode: set}], reason: "Lägre lagerhöjd hjälper Z-upplösning för passningskritiska delar.", confidence: 0.72}
- {id: Q04, group: quality, priority: 63, conditions: [{path: answers.priority, op: eq, value: accuracy}], actions: [{setting: speed_preset, value: Silent, mode: set}], reason: "Lägre hastighet minskar dynamiska måttfel.", confidence: 0.68}
- {id: Q05, group: quality, priority: 64, conditions: [{path: answers.priority, op: eq, value: finish}], actions: [{setting: layer_height, value: 0.16 mm, mode: set}], reason: "0,16 mm minskar synliga lagersteg.", confidence: 0.82}
- {id: Q06, group: quality, priority: 65, conditions: [{path: answers.priority, op: eq, value: finish}], actions: [{setting: seam, value: Back, mode: set}], reason: "Sömmen placeras på en kontrollerad mindre synlig sida.", confidence: 0.72}
- {id: Q07, group: quality, priority: 66, conditions: [{path: answers.priority, op: eq, value: speed}], actions: [{setting: layer_height, value: 0.24 mm, mode: set}], reason: "0,24 mm minskar antalet lager med 0,4 mm-munstycke.", confidence: 0.79}
- {id: Q08, group: quality, priority: 67, conditions: [{path: answers.priority, op: eq, value: speed}], actions: [{setting: infill_percent, value: 15, mode: min}], reason: "En måttlig fyllnadsgrad begränsar utskriftstid.", confidence: 0.7}
- {id: Q09, group: quality, priority: 90, conditions: [{path: answers.supportsAllowed, op: eq, value: false}], actions: [{setting: support, value: "Off — orientation required", mode: set}], reason: "Support is disallowed; orientation must resolve critical overhangs.", confidence: 0.95}
- {id: Q10, group: quality, priority: 91, conditions: [{path: answers.supportsAllowed, op: eq, value: false}], actions: [{setting: orientation, value: "$analysis.orientationLabel", mode: set}], reason: "A support-free orientation is a hard requirement.", confidence: 0.88}
# Optimization objectives (O01-O04). These refine the same requirement context; they never replace answers.
- {id: O01, group: optimization, priority: 100, conditions: [{path: objective, op: eq, value: time}, {path: answers.priority, op: eq, value: strength}], actions: [{setting: layer_height, value: 0.24 mm, mode: set}], reason: "Time weighting uses a coarser general-purpose layer height while retaining the structural settings.", confidence: 0.79}
- {id: O02, group: optimization, priority: 101, conditions: [{path: objective, op: eq, value: time}], actions: [{setting: infill_percent, value: 15, mode: min}], reason: "Time weighting does not add infill beyond stronger matched minimums.", confidence: 0.7}
- {id: O03, group: optimization, priority: 102, conditions: [{path: objective, op: eq, value: performance}], actions: [{setting: wall_loops, value: 5, mode: min}], reason: "Performance weighting adds continuous perimeter margin.", confidence: 0.8}
- {id: O04, group: optimization, priority: 103, conditions: [{path: objective, op: eq, value: performance}], actions: [{setting: infill_percent, value: 25, mode: min}], reason: "Performance weighting adds an internal-structure margin.", confidence: 0.72}
- {id: O05, group: optimization, priority: 104, conditions: [{path: objective, op: eq, value: visual-quality}], actions: [{setting: layer_height, value: 0.16 mm, mode: set}], reason: "Visual-quality weighting uses a finer general-purpose layer height.", confidence: 0.82}
- {id: O06, group: optimization, priority: 105, conditions: [{path: objective, op: eq, value: visual-quality}], actions: [{setting: speed_preset, value: Silent, mode: set}, {setting: seam, value: Back, mode: set}], reason: "Visual-quality weighting reduces dynamic surface artifacts and keeps the seam controlled.", confidence: 0.68}
- {id: O07, group: optimization, priority: 106, conditions: [{path: objective, op: eq, value: fit-accuracy}], actions: [{setting: layer_height, value: 0.16 mm, mode: set}, {setting: speed_preset, value: Silent, mode: set}], reason: "Fit-and-accuracy weighting uses finer layers and a slower process starting point.", confidence: 0.72}
- {id: O08, group: optimization, priority: 107, conditions: [{path: objective, op: eq, value: fit-accuracy}], actions: [{setting: wall_order, value: Outer/Inner, mode: set}], reason: "Fit-and-accuracy weighting keeps the dimensional outer wall controlled.", confidence: 0.7}
- {id: O09, group: optimization, priority: 108, conditions: [{path: objective, op: eq, value: time}, {path: answers.priority, op: eq, value: accuracy}], actions: [{setting: layer_height, value: 0.20 mm, mode: set}], reason: "Time weighting accepts a coarser layer height than the fit-oriented baseline while retaining its structural settings.", confidence: 0.7}
- {id: O10, group: optimization, priority: 109, conditions: [{path: objective, op: eq, value: time}, {path: answers.priority, op: eq, value: finish}], actions: [{setting: layer_height, value: 0.20 mm, mode: set}], reason: "Time weighting accepts more visible layer stepping than the surface-oriented baseline.", confidence: 0.7}

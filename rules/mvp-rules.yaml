# Check Make MVP rule catalog. Earlier priorities establish defaults; later rules refine them.
# Geometry (G01-G13)
- {id: G01, group: geometry, priority: 1, conditions: [], actions: [{setting: orientation, value: "$analysis.orientationLabel", mode: set}], reason: "Geometry-ranked orientation.", confidence: 0.72}
- {id: G02, group: geometry, priority: 20, conditions: [{path: analysis.heightMm, op: gt, value: 150}], actions: [{setting: speed_preset, value: Silent, mode: set}], reason: "En hög modell gynnas av lägre acceleration och mindre vibration.", confidence: 0.72}
- {id: G03, group: geometry, priority: 21, conditions: [{path: analysis.bedContactAreaMm2, op: lt, value: 400}], actions: [{setting: brim, value: 8 mm, mode: set}], reason: "Den uppskattade kontaktytan mot plattan är liten.", confidence: 0.7}
- {id: G04, group: geometry, priority: 22, conditions: [{path: analysis.bedContactAreaMm2, op: gte, value: 400}], actions: [{setting: brim, value: Off, mode: set}], reason: "No obvious brim requirement.", confidence: 0.65}
- {id: G05, group: geometry, priority: 23, conditions: [{path: analysis.overhangRatio, op: gt, value: 0.08}], actions: [{setting: support, value: Auto, mode: set}], reason: "Automatic support required by overhang estimate.", confidence: 0.72}
- {id: G06, group: geometry, priority: 24, conditions: [{path: analysis.overhangRatio, op: lte, value: 0.08}], actions: [{setting: support, value: Off, mode: set}], reason: "Low support risk.", confidence: 0.68}
- {id: G07, group: geometry, priority: 25, conditions: [{path: analysis.overhangRatio, op: gt, value: 0.2}], actions: [{setting: orientation, value: "$analysis.orientationLabel", mode: set}], reason: "Geometry-ranked orientation.", confidence: 0.78}
- {id: G08, group: geometry, priority: 26, conditions: [{path: analysis.heightMm, op: lt, value: 20}], actions: [{setting: layer_height, value: 0.16 mm, mode: set}], reason: "En låg detalj kan vinna synlig Z-upplösning till måttlig tidskostnad.", confidence: 0.62}
- {id: G09, group: geometry, priority: 27, conditions: [{path: analysis.heightMm, op: gt, value: 220}], actions: [{setting: brim, value: 10 mm, mode: set}], reason: "Mycket hög modell ökar hävstång och vidhäftningsrisk.", confidence: 0.75}
- {id: G10, group: geometry, priority: 28, conditions: [{path: analysis.boundingBox.size.x, op: gt, value: 240}], actions: [{setting: orientation, value: "$analysis.orientationLabel", mode: set}], reason: "Rotate to fit the available build volume.", confidence: 0.9}
- {id: G11, group: geometry, priority: 29, conditions: [{path: spatial.confirmedCriticalThin, op: eq, value: true}], actions: [{setting: wall_generator, value: Arachne, mode: set}], reason: "A user-confirmed thin region keeps the variable-width wall generator active; this does not claim the region is structurally adequate.", confidence: 0.58}
- {id: G12, group: geometry, priority: 92, conditions: [{path: answers.supportPreference, op: eq, value: required}], actions: [{setting: support, value: Auto, mode: set}], reason: "The user overrode Check Make's geometry assessment and requested removable supports.", confidence: 0.95}
- {id: G13, group: geometry, priority: 93, conditions: [{path: answers.supportPreference, op: eq, value: forbidden}], actions: [{setting: support, value: "Off — orientation required", mode: set}], reason: "The user overrode Check Make's geometry assessment and requested a support-free plan.", confidence: 0.95}
# Usage (U01-U12)
- {id: U01, group: usage, priority: 29, conditions: [{path: intent.compatibility.structural, op: eq, value: true}], actions: [{setting: wall_loops, value: 4, mode: min}], reason: "Användningsbeskrivningen tyder på en bärande eller mekanisk funktion.", confidence: 0.78}
- {id: U02, group: usage, priority: 30, conditions: [{path: answers.impact, op: eq, value: medium}], actions: [{setting: wall_loops, value: 4, mode: min}], reason: "Måttlig slagbelastning kräver mer sammanhängande perimeter.", confidence: 0.84}
- {id: U03, group: usage, priority: 31, conditions: [{path: answers.impact, op: eq, value: high}], actions: [{setting: wall_loops, value: 5, mode: min}], reason: "Hög slagbelastning prioriterar fem väggslingor.", confidence: 0.86}
- {id: U04, group: usage, priority: 32, conditions: [{path: answers.impact, op: eq, value: high}], actions: [{setting: infill_percent, value: 25, mode: min}], reason: "Hög slagbelastning motiverar en måttligt hög fyllnadsgrad.", confidence: 0.78}
- {id: U05, group: usage, priority: 33, conditions: [{path: answers.impact, op: eq, value: medium}], actions: [{setting: infill_percent, value: 20, mode: min}], reason: "Måttlig belastning motiverar 20 procent fyllnad.", confidence: 0.77}
- {id: U06, group: usage, priority: 34, conditions: [{path: answers.load, op: eq, value: cyclic}], actions: [{setting: wall_loops, value: 4, mode: min}], reason: "Upprepad belastning kräver fler sammanhängande perimetrar för bättre utmattningsmarginal.", confidence: 0.76}
- {id: U07, group: usage, priority: 35, conditions: [{path: intent.compatibility.fitCritical, op: eq, value: true}], actions: [{setting: wall_order, value: Outer/Inner, mode: set}], reason: "Beskrivningen tyder på passningskritiska ytor; yttervägg först kan ge stabilare yttre mått.", confidence: 0.69}
- {id: U08, group: usage, priority: 36, conditions: [{path: intent.compatibility.fitCritical, op: eq, value: true}], actions: [{setting: seam, value: Aligned/back, mode: set}], reason: "Beskrivningen tyder på passning; placera sömmen bort från kontaktytor.", confidence: 0.72}
- {id: U09, group: usage, priority: 37, conditions: [{path: answers.environment, op: eq, value: outdoor}], actions: [{setting: top_layers, value: 6, mode: min}], reason: "Extra toppskikt förbättrar kapsling mot väder.", confidence: 0.7}
- {id: U10, group: usage, priority: 38, conditions: [{path: answers.environment, op: eq, value: outdoor}], actions: [{setting: bottom_layers, value: 5, mode: min}], reason: "Extra bottenskikt förbättrar robusthet i utomhusbruk.", confidence: 0.7}
- {id: U11, group: usage, priority: 39, conditions: [{path: intent.failureConsequence.value, op: eq, value: safety-critical}], actions: [{setting: wall_loops, value: 5, mode: min}], reason: "Ett konstruktörsangivet lastkritiskt användningsfall behåller extra perimetermarginal utan att påstå verifierad bärförmåga.", confidence: 0.68}
- {id: U12, group: usage, priority: 40, conditions: [{path: intent.failureConsequence.value, op: eq, value: safety-critical}], actions: [{setting: infill_percent, value: 25, mode: min}], reason: "Ett konstruktörsangivet lastkritiskt användningsfall behåller intern struktur som försiktig startpunkt, inte som säkerhetsfaktor.", confidence: 0.62}
# Material (M01-M09)
- {id: M01, group: material, priority: 2, conditions: [], actions: [{setting: material, value: PLA, mode: set}, {setting: nozzle_temperature, value: "220 °C", mode: set}, {setting: bed_temperature, value: "55 °C", mode: set}], reason: "PLA baseline.", confidence: 0.7}

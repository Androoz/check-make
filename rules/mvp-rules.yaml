# OptimusPrint MVP rule catalog. Earlier priorities establish defaults; later rules refine them.
# Geometry (G01-G10)
- {id: G01, group: geometry, priority: 1, conditions: [], actions: [{setting: orientation, value: current, mode: set}], reason: "Behåll importerad orientering tills en tydlig geometri-risk hittas.", confidence: 0.55}
- {id: G02, group: geometry, priority: 20, conditions: [{path: analysis.heightMm, op: gt, value: 150}], actions: [{setting: speed_preset, value: Silent, mode: set}], reason: "En hög modell gynnas av lägre acceleration och mindre vibration.", confidence: 0.72}
- {id: G03, group: geometry, priority: 21, conditions: [{path: analysis.bedContactAreaMm2, op: lt, value: 400}], actions: [{setting: brim, value: 8 mm, mode: set}], reason: "Den uppskattade kontaktytan mot plattan är liten.", confidence: 0.7}
- {id: G04, group: geometry, priority: 22, conditions: [{path: analysis.bedContactAreaMm2, op: gte, value: 400}], actions: [{setting: brim, value: Av, mode: set}], reason: "Kontaktytan ger ingen uppenbar brim-indikation.", confidence: 0.65}
- {id: G05, group: geometry, priority: 23, conditions: [{path: analysis.overhangRatio, op: gt, value: 0.08}], actions: [{setting: support, value: Auto, mode: set}], reason: "Modellen har en märkbar andel nedåtvända ytor över 45 grader.", confidence: 0.72}
- {id: G06, group: geometry, priority: 24, conditions: [{path: analysis.overhangRatio, op: lte, value: 0.08}], actions: [{setting: support, value: Av, mode: set}], reason: "Överhängsestimatet visar låg support-risk.", confidence: 0.68}
- {id: G07, group: geometry, priority: 25, conditions: [{path: analysis.overhangRatio, op: gt, value: 0.2}], actions: [{setting: orientation, value: "Prova bredaste stabila sida", mode: set}], reason: "Många kritiska överhäng motiverar en alternativ orientering.", confidence: 0.66}
- {id: G08, group: geometry, priority: 26, conditions: [{path: analysis.heightMm, op: lt, value: 20}], actions: [{setting: layer_height, value: 0.16 mm, mode: set}], reason: "En låg detalj kan vinna synlig Z-upplösning till måttlig tidskostnad.", confidence: 0.62}
- {id: G09, group: geometry, priority: 27, conditions: [{path: analysis.heightMm, op: gt, value: 220}], actions: [{setting: brim, value: 10 mm, mode: set}], reason: "Mycket hög modell ökar hävstång och vidhäftningsrisk.", confidence: 0.75}
- {id: G10, group: geometry, priority: 28, conditions: [{path: analysis.boundingBox.size.x, op: gt, value: 240}], actions: [{setting: orientation, value: "Rotera inom byggvolym", mode: set}], reason: "Modellens X-mått närmar sig eller överskrider byggytan.", confidence: 0.9}
# Usage (U01-U10)
- {id: U01, group: usage, priority: 2, conditions: [], actions: [{setting: wall_loops, value: 3, mode: min}], reason: "Funktionella utskrifter börjar med minst tre väggslingor.", confidence: 0.8}
- {id: U02, group: usage, priority: 30, conditions: [{path: answers.impact, op: eq, value: medium}], actions: [{setting: wall_loops, value: 4, mode: min}], reason: "Måttlig slagbelastning kräver mer sammanhängande perimeter.", confidence: 0.84}
- {id: U03, group: usage, priority: 31, conditions: [{path: answers.impact, op: eq, value: high}], actions: [{setting: wall_loops, value: 5, mode: min}], reason: "Hög slagbelastning prioriterar fem väggslingor.", confidence: 0.86}
- {id: U04, group: usage, priority: 32, conditions: [{path: answers.impact, op: eq, value: high}], actions: [{setting: infill_percent, value: 25, mode: min}], reason: "Hög slagbelastning motiverar en måttligt hög fyllnadsgrad.", confidence: 0.78}
- {id: U05, group: usage, priority: 33, conditions: [{path: answers.impact, op: eq, value: medium}], actions: [{setting: infill_percent, value: 20, mode: min}], reason: "Måttlig belastning motiverar 20 procent fyllnad.", confidence: 0.77}
- {id: U06, group: usage, priority: 34, conditions: [{path: answers.impact, op: eq, value: none}], actions: [{setting: infill_percent, value: 15, mode: min}], reason: "Utan slagbelastning är 15 procent en resurssnål startpunkt.", confidence: 0.72}
- {id: U07, group: usage, priority: 35, conditions: [{path: answers.fitCritical, op: eq, value: true}], actions: [{setting: wall_order, value: Outer/Inner, mode: set}], reason: "Yttervägg först kan ge stabilare yttre mått på passningsytor.", confidence: 0.69}
- {id: U08, group: usage, priority: 36, conditions: [{path: answers.fitCritical, op: eq, value: true}], actions: [{setting: seam, value: Aligned/back, mode: set}], reason: "Placera sömmen bort från passningsytor.", confidence: 0.72}
- {id: U09, group: usage, priority: 37, conditions: [{path: answers.outdoor, op: eq, value: true}], actions: [{setting: top_layers, value: 6, mode: min}], reason: "Extra toppskikt förbättrar kapsling mot väder.", confidence: 0.7}
- {id: U10, group: usage, priority: 38, conditions: [{path: answers.outdoor, op: eq, value: true}], actions: [{setting: bottom_layers, value: 5, mode: min}], reason: "Extra bottenskikt förbättrar robusthet i utomhusbruk.", confidence: 0.7}
# Material (M01-M10)
- {id: M01, group: material, priority: 3, conditions: [], actions: [{setting: layer_height, value: 0.20 mm, mode: set}], reason: "0,20 mm är en robust startpunkt för 0,4 mm-munstycke.", confidence: 0.9}
- {id: M02, group: material, priority: 4, conditions: [], actions: [{setting: infill_type, value: Gyroid, mode: set}], reason: "Gyroid är en generell fyllnad för okänd belastningsriktning.", confidence: 0.77}
- {id: M03, group: material, priority: 5, conditions: [], actions: [{setting: wall_generator, value: Arachne, mode: set}], reason: "Arachne hanterar varierande väggbredder väl.", confidence: 0.74}
- {id: M04, group: material, priority: 40, conditions: [{path: answers.material, op: eq, value: PLA}], actions: [{setting: speed_preset, value: Standard, mode: set}], reason: "PLA fungerar normalt med skrivarens standardprofil.", confidence: 0.85}
- {id: M05, group: material, priority: 41, conditions: [{path: answers.material, op: eq, value: PETG}], actions: [{setting: speed_preset, value: Standard, mode: set}], reason: "PETG-processprofilens standardhastighet är säker utgångspunkt.", confidence: 0.82}
- {id: M06, group: material, priority: 42, conditions: [{path: answers.material, op: eq, value: PETG}], actions: [{setting: seam, value: Back, mode: set}], reason: "En kontrollerad söm minskar slumpmässiga PETG-märken.", confidence: 0.64}
- {id: M07, group: material, priority: 43, conditions: [{path: answers.material, op: eq, value: PLA}], actions: [{setting: seam, value: Nearest/back, mode: set}], reason: "Samlad söm förenklar efterbearbetning.", confidence: 0.62}
- {id: M08, group: material, priority: 44, conditions: [{path: answers.material, op: eq, value: PETG}], actions: [{setting: wall_loops, value: 3, mode: min}], reason: "PETG-detaljer behåller minst tre väggslingor.", confidence: 0.76}
- {id: M09, group: material, priority: 45, conditions: [{path: answers.material, op: eq, value: PLA}], actions: [{setting: top_layers, value: 5, mode: min}], reason: "Fem topplager ger normalt tät topp vid 0,20 mm.", confidence: 0.78}
- {id: M10, group: material, priority: 46, conditions: [{path: answers.material, op: eq, value: PETG}], actions: [{setting: top_layers, value: 5, mode: min}], reason: "Fem topplager är en stabil PETG-startpunkt.", confidence: 0.76}
# Printer (P01-P10)
- {id: P01, group: printer, priority: 6, conditions: [], actions: [{setting: top_layers, value: 5, mode: min}], reason: "Basprofilen använder fem topplager.", confidence: 0.82}
- {id: P02, group: printer, priority: 7, conditions: [], actions: [{setting: bottom_layers, value: 4, mode: min}], reason: "Basprofilen använder fyra bottenskikt.", confidence: 0.82}
- {id: P03, group: printer, priority: 8, conditions: [], actions: [{setting: wall_order, value: Inner/Outer, mode: set}], reason: "Inner/Outer är robust standard för funktionell geometri.", confidence: 0.78}
- {id: P04, group: printer, priority: 50, conditions: [{path: answers.printer, op: eq, value: X1C}], actions: [{setting: speed_preset, value: Standard, mode: set}], reason: "X1C-standardprofilen är rekommenderad baslinje.", confidence: 0.9}
- {id: P05, group: printer, priority: 51, conditions: [{path: answers.printer, op: eq, value: P1S}], actions: [{setting: speed_preset, value: Standard, mode: set}], reason: "P1S-standardprofilen är rekommenderad baslinje.", confidence: 0.9}
- {id: P06, group: printer, priority: 9, conditions: [{path: answers.printer, op: eq, value: X1C}], actions: [{setting: brim, value: Av, mode: set}], reason: "Ingen skrivarspecifik brim krävs utan geometrisignal.", confidence: 0.55}
- {id: P07, group: printer, priority: 10, conditions: [{path: answers.printer, op: eq, value: P1S}], actions: [{setting: brim, value: Av, mode: set}], reason: "Ingen skrivarspecifik brim krävs utan geometrisignal.", confidence: 0.55}
- {id: P08, group: printer, priority: 11, conditions: [{path: answers.printer, op: eq, value: X1C}], actions: [{setting: support, value: Av, mode: set}], reason: "Support aktiveras endast av geometri eller användarkrav.", confidence: 0.55}
- {id: P09, group: printer, priority: 12, conditions: [{path: answers.printer, op: eq, value: P1S}], actions: [{setting: support, value: Av, mode: set}], reason: "Support aktiveras endast av geometri eller användarkrav.", confidence: 0.55}
- {id: P10, group: printer, priority: 56, conditions: [{path: analysis.heightMm, op: gt, value: 150}], actions: [{setting: speed_preset, value: Silent, mode: set}], reason: "Båda MVP-skrivarna gynnas av lugnare profil för höga modeller.", confidence: 0.7}
# Quality (Q01-Q10)
- {id: Q01, group: quality, priority: 60, conditions: [{path: answers.priority, op: eq, value: strength}], actions: [{setting: wall_loops, value: 4, mode: min}], reason: "Styrkeprioritet lägger material i perimetrarna.", confidence: 0.85}
- {id: Q02, group: quality, priority: 61, conditions: [{path: answers.priority, op: eq, value: strength}], actions: [{setting: infill_percent, value: 20, mode: min}], reason: "Styrkeprioritet använder minst 20 procent fyllnad.", confidence: 0.78}
- {id: Q03, group: quality, priority: 62, conditions: [{path: answers.priority, op: eq, value: accuracy}], actions: [{setting: layer_height, value: 0.16 mm, mode: set}], reason: "Lägre lagerhöjd hjälper Z-upplösning för passningskritiska delar.", confidence: 0.72}
- {id: Q04, group: quality, priority: 63, conditions: [{path: answers.priority, op: eq, value: accuracy}], actions: [{setting: speed_preset, value: Silent, mode: set}], reason: "Lägre hastighet minskar dynamiska måttfel.", confidence: 0.68}
- {id: Q05, group: quality, priority: 64, conditions: [{path: answers.priority, op: eq, value: finish}], actions: [{setting: layer_height, value: 0.16 mm, mode: set}], reason: "0,16 mm minskar synliga lagersteg.", confidence: 0.82}
- {id: Q06, group: quality, priority: 65, conditions: [{path: answers.priority, op: eq, value: finish}], actions: [{setting: seam, value: Back, mode: set}], reason: "Sömmen placeras på en kontrollerad mindre synlig sida.", confidence: 0.72}
- {id: Q07, group: quality, priority: 66, conditions: [{path: answers.priority, op: eq, value: speed}], actions: [{setting: layer_height, value: 0.24 mm, mode: set}], reason: "0,24 mm minskar antalet lager med 0,4 mm-munstycke.", confidence: 0.79}
- {id: Q08, group: quality, priority: 67, conditions: [{path: answers.priority, op: eq, value: speed}], actions: [{setting: infill_percent, value: 15, mode: min}], reason: "En måttlig fyllnadsgrad begränsar utskriftstid.", confidence: 0.7}
- {id: Q09, group: quality, priority: 90, conditions: [{path: answers.supportsAllowed, op: eq, value: false}], actions: [{setting: support, value: "Av – ändra orientering", mode: set}], reason: "Support är inte tillåtet; orienteringen måste lösa kritiska överhäng.", confidence: 0.95}
- {id: Q10, group: quality, priority: 91, conditions: [{path: answers.supportsAllowed, op: eq, value: false}], actions: [{setting: orientation, value: "Minimera överhäng", mode: set}], reason: "Supportförbud gör supportfri orientering till ett hårt krav.", confidence: 0.88}

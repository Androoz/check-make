# Reference scopes expose evidence gaps before a real printer/material lot is locked.
- id: P1-X1C-PLA-ADHESION
  label: Consumer PLA adhesion screening on the default X1 Carbon reference profile
  ruleIds: [G03, G04, G09, P07]
  scope:
    process: material-extrusion
    materialFamily: PLA
    printerManufacturer: Bambu Lab
    printerModel: X1 Carbon
    kinematicClass: corexy
    nozzleDiameterMm: 0.4
    layerHeightMm: 0.2
    enclosure: true
    buildSurface: textured PEI
    slicer: Bambu Studio
    geometryClass: adhesion-test-specimen
    outcomeDomain: adhesion-failure


[package]
name = "check-make"
version = "0.2.6-beta.6"
edition = "2021"
description = "Needs-first desktop planning for verifiable 3D-print projects"
license = "MIT"
repository = "https://github.com/Androoz/check-make"
homepage = "https://github.com/Androoz/check-make"
[lib]
name = "check_make_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stl_io = "0.8"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
tauri-plugin-opener = "2"
[build-dependencies]
tauri-build = { version = "2", features = [] }

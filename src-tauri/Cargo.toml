[package]
name = "optimusprint"
version = "0.1.0"
edition = "2021"
[lib]
name = "optimusprint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
stl_io = "0.8"
[build-dependencies]
tauri-build = { version = "2", features = [] }

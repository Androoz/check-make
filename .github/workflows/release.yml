name: Build draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in package.json and tauri.conf.json, without a v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release source
    runs-on: ubuntu-22.04
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Verify synchronized version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          test "$PACKAGE_VERSION" = "${{ inputs.version }}"
          test "$TAURI_VERSION" = "$PACKAGE_VERSION"
          test "$CARGO_VERSION" = "$PACKAGE_VERSION"
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - label: macOS Intel
            platform: macos-15-intel
            args: --target x86_64-apple-darwin --bundles dmg
          - label: Windows x64
            platform: windows-latest
            args: --bundles nsis
          - label: Linux x64
            platform: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Configure macOS signing and notarization
        if: startsWith(matrix.platform, 'macos-')
        id: macos_signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri treats an empty APPLE_* variable as configured, so only export
          # the variables that are actually available. Everything else falls back
          # to an ad-hoc signature that Gatekeeper will not trust.
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            {
              echo "APPLE_CERTIFICATE<<CHECKMAKE_EOF"
              echo "$APPLE_CERTIFICATE"
              echo "CHECKMAKE_EOF"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "Signing mode: Developer ID ($APPLE_SIGNING_IDENTITY)"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD or APPLE_SIGNING_IDENTITY is missing; falling back to ad-hoc signing."
          fi

          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "notarize=true" >> "$GITHUB_OUTPUT"
            echo "Notarization: enabled for team $APPLE_TEAM_ID"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            if [[ -n "$APPLE_CERTIFICATE" ]]; then
              echo "::warning::APPLE_ID, APPLE_PASSWORD or APPLE_TEAM_ID is missing; the build will be signed but not notarized."
            fi
          fi
      - name: Build and upload to a draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Check Make v__VERSION__
          releaseBody: |
            Draft build generated from a verified source revision.

            Before publishing, record installation and smoke-test results for every attached platform in docs/RELEASING.md. Each macOS job logs whether it used Developer ID signing and notarization or fell back to ad-hoc signing; the "Verify macOS signature and notarization" step is the evidence. Windows builds are unsigned until a code-signing certificate is configured. Linux slicer integration is not yet release-validated.
          releaseDraft: true
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          generateReleaseNotes: true
          args: ${{ matrix.args }}
          releaseAssetNamePattern: Check-Make-[version]-[platform]-[arch][setup][ext]
      - name: Verify macOS signature and notarization
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.macos_signing.outputs.mode }}
          NOTARIZED: ${{ steps.macos_signing.outputs.notarize }}
        run: |
          set -euo pipefail
          TARGET_DIR="src-tauri/target/$(echo '${{ matrix.args }}' | sed -n 's/.*--target \([^ ]*\).*/\1/p')/release/bundle"
          APP="$(find "$TARGET_DIR/macos" -maxdepth 1 -name '*.app' | head -1)"
          DMG="$(find "$TARGET_DIR/dmg" -maxdepth 1 -name '*.dmg' | head -1)"
          echo "App bundle: $APP"
          echo "Disk image: $DMG"
          echo "## macOS signing evidence (${{ matrix.label }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing mode: $SIGNING_MODE" >> "$GITHUB_STEP_SUMMARY"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Identifier=|flags=' || true
          if [[ "$SIGNING_MODE" == "developer-id" ]]; then
            codesign -dv "$APP" 2>&1 | grep -q 'flags=.*runtime' || { echo "Hardened runtime is not enabled"; exit 1; }
            if [[ "$NOTARIZED" == "true" ]]; then
              xcrun stapler validate "$APP"
              spctl --assess --type execute --verbose=2 "$APP"
              if xcrun stapler validate "$DMG"; then
                echo "- Notarization ticket: stapled to app and DMG, Gatekeeper assessment passed" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::The app is notarized and stapled, but the DMG has no stapled ticket. Gatekeeper will still verify online."
                echo "- Notarization ticket: stapled to app, missing on DMG (online verification only), Gatekeeper assessment passed" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "- Notarization: not performed" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- Notarization: not performed (ad-hoc signature)" >> "$GITHUB_STEP_SUMMARY"
          fi
